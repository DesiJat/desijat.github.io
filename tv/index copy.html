
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZetaMeld - Live Television</title>

<!-- HLS support for browsers without native HLS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #090d16;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    height: 70px;
    background: #111827;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #38bdf8;
}

.logo span {
    color: white;
}

.search {
    width: 280px;
    padding: 11px 15px;
    border-radius: 8px;
    border: 1px solid #374151;
    background: #1f2937;
    color: white;
    outline: none;
}

.container {
    padding: 25px 5%;
}

.hero {
    background: linear-gradient(120deg, #164e63, #1e1b4b);
    padding: 30px;
    border-radius: 15px;
    margin-bottom: 25px;
}

.hero h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.hero p {
    color: #cbd5e1;
}

.filters {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

select {
    padding: 11px;
    background: #1f2937;
    color: white;
    border: 1px solid #374151;
    border-radius: 7px;
    outline: none;
}

.section-title {
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.channels {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 15px;
}

.channel {
    background: #151d2c;
    border: 1px solid #253047;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
    min-width: 0;
}

.channel:hover {
    transform: translateY(-4px);
    border-color: #38bdf8;
    background: #1e293b;
}

.channel img {
    width: 75px;
    height: 65px;
    object-fit: contain;
    margin-bottom: 10px;
}

.channel h3 {
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.channel small {
    display: block;
    color: #94a3b8;
    margin-top: 6px;
}

.player-section {
    display: none;
    background: #151d2c;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 30px;
}

.player-section.active {
    display: block;
}

.player-section h2 {
    margin-bottom: 15px;
}

video {
    width: 100%;
    max-height: 480px;
    background: black;
    border-radius: 10px;
}

.player-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
}

.close-btn {
    background: #ef4444;
    color: white;
    border: 0;
    padding: 9px 15px;
    border-radius: 6px;
    cursor: pointer;
}

.status {
    color: #94a3b8;
    margin-bottom: 18px;
    font-size: 13px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #64748b;
    margin-top: 40px;
}

@media(max-width: 600px) {
    header {
        padding: 0 15px;
    }

    .search {
        width: 160px;
    }

    .container {
        padding: 20px 15px;
    }

    .hero h1 {
        font-size: 23px;
    }

    .channels {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Stream<span>TV.</span></div>
    <input
        type="search"
        id="search"
        class="search"
        placeholder="Search channels..."
    >
</header>

<main class="container">

    <section class="hero">
        <h1>Watch Live TV Anywhere</h1>
        <p>Explore free, publicly listed television streams from around the world.</p>
    </section>

    <section id="playerSection" class="player-section">
        <h2 id="playingTitle">Now Playing</h2>

        <video id="video" controls autoplay playsinline>
            Your browser does not support video.
        </video>

        <div class="player-info">
            <span id="playerStatus">Loading stream...</span>
            <button class="close-btn" onclick="closePlayer()">Close</button>
        </div>
    </section>

    <div class="filters">
        <select id="countryFilter">
            <option value="">All Countries</option>
        </select>

        <select id="categoryFilter">
            <option value="">All Categories</option>
        </select>
    </div>

    <div class="section-title">
        <h2>Live Channels</h2>
        <span id="count">Loading...</span>
    </div>

    <p class="status" id="status">Fetching channels...</p>

    <div class="channels" id="channels"></div>

</main>

<footer>
    ZetaMeld - Personal Stream Player
</footer>

<script>
// const API = "https://iptv-org.github.io/api/";
const API = "./data/";

const state = {
    channels: [],
    streams: [],
    logos: [],
    countries: [],
    categories: []
};

const video = document.getElementById("video");
const playerSection = document.getElementById("playerSection");

let hls = null;

async function fetchData() {
    try {
        const [channels, streams, logos, countries, categories] =
            await Promise.all([
                fetch(API + "channels.json").then(r => {
                    if (!r.ok) throw new Error("Channels unavailable");
                    return r.json();
                }),
                fetch(API + "streams.json").then(r => {
                    if (!r.ok) throw new Error("Streams unavailable");
                    return r.json();
                }),
                fetch(API + "logos.json").then(r => r.json()),
                fetch(API + "countries.json").then(r => r.json()),
                fetch(API + "categories.json").then(r => r.json())
            ]);

        state.channels = channels.filter(c => !c.is_nsfw && !c.closed);
        state.streams = streams;
        state.logos = logos;
        state.countries = countries;
        state.categories = categories;

        populateFilters();
        renderChannels();

        document.getElementById("status").textContent =
            "Choose a channel to start watching.";

    } catch (error) {
        document.getElementById("status").textContent =
            "Unable to load channels. Please refresh the page.";

        console.error(error);
    }
}

function populateFilters() {
    const countrySelect = document.getElementById("countryFilter");
    const categorySelect = document.getElementById("categoryFilter");

    state.countries.forEach(country => {
        const option = document.createElement("option");
        option.value = country.code;
        option.textContent = country.name;
        countrySelect.appendChild(option);
    });

    state.categories.forEach(category => {
        const option = document.createElement("option");
        option.value = category.id;
        option.textContent = category.name;
        categorySelect.appendChild(option);
    });
}

function renderChannels() {
    const search = document.getElementById("search")
        .value.toLowerCase();

    const country = document.getElementById("countryFilter").value;
    const category = document.getElementById("categoryFilter").value;

    const container = document.getElementById("channels");
    container.innerHTML = "";

    const filtered = state.channels.filter(channel => {
        const matchesSearch =
            channel.name.toLowerCase().includes(search);

        const matchesCountry =
            !country || channel.country === country;

        const matchesCategory =
            !category || (channel.categories || []).includes(category);

        return matchesSearch && matchesCountry && matchesCategory;
    });

    document.getElementById("count").textContent =
        filtered.length + " channels";

    if (!filtered.length) {
        container.textContent = "No channels found.";
        return;
    }

    const fragment = document.createDocumentFragment();

    filtered.slice(0, 300).forEach(channel => {
        const stream = state.streams.find(s =>
            s.channel === channel.id
        );

        const logo = state.logos.find(l =>
            l.channel === channel.id && l.in_use
        ) || state.logos.find(l =>
            l.channel === channel.id
        );

        const card = document.createElement("div");
        card.className = "channel";

        const img = document.createElement("img");
        img.src = logo?.url || "";
        img.alt = channel.name;
        img.loading = "lazy";
        img.onerror = () => {
            img.style.display = "none";
        };

        const title = document.createElement("h3");
        title.textContent = channel.name;

        const countryName = state.countries.find(c =>
            c.code === channel.country
        )?.name || channel.country || "Unknown";

        const subtitle = document.createElement("small");
        subtitle.textContent = countryName;

        const availability = document.createElement("small");
        availability.textContent = stream ? "● Available" : "○ No stream";
        availability.style.color = stream ? "#4ade80" : "#94a3b8";

        card.append(img, title, subtitle, availability);

        if (stream) {
            card.addEventListener("click", () => {
                playChannel(channel, stream);
            });
        } else {
            card.style.opacity = ".6";
            card.title = "No stream currently listed";
        }

        fragment.appendChild(card);
    });

    container.appendChild(fragment);
}

function playChannel(channel, stream) {
    playerSection.classList.add("active");

    document.getElementById("playingTitle").textContent =
        "Now Playing: " + channel.name;

    document.getElementById("playerStatus").textContent =
        "Connecting...";

    // Destroy previous HLS instance
    if (hls) {
        hls.destroy();
        hls = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    const url = stream.url;

    if (Hls.isSupported() && url.includes(".m3u8")) {
        hls = new Hls();

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {});
            document.getElementById("playerStatus").textContent =
                "Playing";
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                document.getElementById("playerStatus").textContent =
                    "Stream unavailable or blocked.";
            }
        });

    } else {
        video.src = url;

        video.play().then(() => {
            document.getElementById("playerStatus").textContent =
                "Playing";
        }).catch(() => {
            document.getElementById("playerStatus").textContent =
                "Unable to play this stream.";
        });
    }

    playerSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

function closePlayer() {
    video.pause();
    video.removeAttribute("src");
    video.load();

    if (hls) {
        hls.destroy();
        hls = null;
    }

    playerSection.classList.remove("active");
}

document.getElementById("search")
    .addEventListener("input", renderChannels);

document.getElementById("countryFilter")
    .addEventListener("change", renderChannels);

document.getElementById("categoryFilter")
    .addEventListener("change", renderChannels);

fetchData();
</script>

</body>
</html>
