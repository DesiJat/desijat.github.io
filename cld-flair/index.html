<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <title>Multi-Agent Chat Room</title>

    <script src="./marked.min.js"></script>

    <style>
        /* =====================================================
   THEME VARIABLES
===================================================== */
        :root {
            --bg-body: #f5f7fa;

            --bg-header: #111827;
            --header-text: #ffffff;
            --header-border: #e5e7eb;
            --header-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);

            --bg-session: #e5e7eb;
            --bg-agent-header: #f1f5f9;
            --bg-messages: #ffffff;

            --text-main: #111827;
            --text-user: #2563eb;
            --border: #d1d5db;

            --btn-bg: #2563eb;
            --btn-text: #ffffff;
        }

        /* ---------------- DARK THEME ---------------- */
        html[data-theme="dark"] {
            --bg-body: #0f172a;

            --bg-header: #020617;
            --header-text: #e5e7eb;
            --header-border: #1e293b;
            --header-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);

            --bg-session: #020617;
            --bg-agent-header: #020617;
            --bg-messages: #020617;

            --text-main: #e5e7eb;
            --text-user: #38bdf8;
            --border: #1e293b;

            --btn-bg: #38bdf8;
            --btn-text: #020617;
        }

        /* ---------------- E-PAPER THEME ---------------- */
        html[data-theme="epaper"] {
            --bg-body: #fafaf9;

            --bg-header: #fafaf9;
            --header-text: #1c1917;
            --header-border: #d6d3d1;
            --header-shadow: none;

            --bg-session: #f5f5f4;
            --bg-agent-header: #f5f5f4;
            --bg-messages: #ffffff;

            --text-main: #1c1917;
            --text-user: #44403c;
            --border: #d6d3d1;

            --btn-bg: #78716c;
            --btn-text: #ffffff;
        }

        /* =====================================================
   BASE LAYOUT
===================================================== */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
        }

        header {
            background: var(--bg-header);
            color: var(--header-text);
            padding: 14px 20px;
            text-align: center;

            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;

            border-bottom: 1px solid var(--header-border);
            box-shadow: var(--header-shadow);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            font-size: 18px;
            line-height: 1.2;
            user-select: none;
        }


        #sessionBar {
            background: var(--bg-session);
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #chat {
            display: flex;
            height: calc(100vh - 110px);
        }

        /* =====================================================
   AGENTS
===================================================== */
        .agent {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .agent:last-child {
            border-right: none;
        }

        .agent h3 {
            margin: 0;
            padding: 10px;
            background: var(--bg-agent-header);
            text-align: center;
        }

        .messages {
            flex: 1;
            padding: 10px;
            background: var(--bg-messages);
            overflow-y: auto;
        }

        .msg {
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.4;
        }

        .user {
            font-weight: bold;
            color: var(--text-user);
        }

        .ai {
            color: var(--text-main);
        }

        /* =====================================================
   INPUT
===================================================== */
        .inputBox {
            display: flex;
            border-top: 1px solid var(--border);
        }

        .inputBox textarea {
            flex: 1;
            padding: 8px;
            border: none;
            resize: none;
            background: transparent;
            color: var(--text-main);
        }

        .inputBox button {
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            background: var(--btn-bg);
            color: var(--btn-text);
        }
    </style>
</head>

<body>

    <header>
        <!-- <span class="header-title">🧠 Multi-Agent AI Chat Room</span> -->
        <span class="header-title">🧠 Multi-Agent</span>
    </header>


    <div id="sessionBar">
        Session:
        <input id="sessionId" value="session-001" />

        <button onclick="createFinalDoc()">📄 Final Doc</button>
        <button onclick="downloadDoc()">⬇ Download</button>
        <button onclick="downloadDocPdf()">⬇ Download PDF</button>
        <button onclick="destroySession()">🗑 Destroy</button>

        <select id="agentSelect"></select>

        <select id="themeSelect" onchange="setTheme(this.value)">
            <option value="light">🌞 Light</option>
            <option value="dark">🌙 Dark</option>
            <option value="epaper">📄 E-Paper</option>
        </select>
    </div>

    <div id="chat"></div>

    <script>
        /* =====================================================
           CONFIG
        ===================================================== */
        // const BASE_URL = "http://localhost:3001";
        // console.log(window.location);
        // const BASE_URL = `http://${window.location.hostname}:3001`;
        const BASE_URL = window.location.origin;
        
        // alert("Make sure your agent server is running at " + BASE_URL);
        // alert(window.location.href);
        // alert(window.location.hostname);
        // alert(window.location.host);

        /* =====================================================
           THEME HANDLING
        ===================================================== */
        function setTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            localStorage.setItem("chat-theme", theme);
        }

        (function initTheme() {
            const saved = localStorage.getItem("chat-theme") || "light";
            setTheme(saved);
            document.getElementById("themeSelect").value = saved;
        })();

        /* =====================================================
           AGENT LOADING
        ===================================================== */
        async function loadAgents() {
            const res = await fetch(`${BASE_URL}/agents`);
            const { agents } = await res.json();

            const chat = document.getElementById("chat");
            const select = document.getElementById("agentSelect");

            chat.innerHTML = "";
            select.innerHTML = "";

            Object.values(agents).forEach(a => {
                chat.appendChild(createAgentUI(a));
                select.appendChild(new Option(`${a.id} (${a.name})`, a.id));
            });
        }

        function createAgentUI(agent) {
            const div = document.createElement("div");
            div.className = "agent";
            div.innerHTML = `
        <h3>${agent.role}</h3>
        <div class="messages" id="messages-${agent.id}"></div>
        <div class="inputBox">
            <textarea rows="2"
                placeholder="Ask ${agent.role}..."
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage('${agent.id}',this)}"
                oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" spellcheck="false" ></textarea>
            <button onclick="sendMessage('${agent.id}', this.previousElementSibling)">Send</button>
        </div>
    `;
            return div;
        }

        /* =====================================================
           CHAT STREAMING
        ===================================================== */
        async function sendMessage(agentId, input) {
            const text = input.value.trim();
            if (!text) return;

            const sessionId = sessionIdEl.value;
            const box = document.getElementById(`messages-${agentId}`);

            box.insertAdjacentHTML("beforeend", `<div class="msg user">👤 ${text}</div>`);
            input.value = "";

            const ai = document.createElement("div");
            ai.className = "msg ai";
            ai.textContent = "🤖 ";
            box.appendChild(ai);
            box.scrollTop = box.scrollHeight;

            const endPointChat='google/chat'; // google vertex ai
            // const endPointChat='local/chat'; // local agent server
            const res = await fetch(`${BASE_URL}/${endPointChat}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                      "Accept": "text/event-stream"
                },
                body: JSON.stringify({ sessionId, agent: agentId, message: text, stream: true })
            });

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let full = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                chunk.split("\n\n").forEach(e => {
                    if (!e.startsWith("data:")) return;
                    const data = e.replace("data:", "").trim();
                    if (data === "[DONE]") {
                        ai.innerHTML = "🤖 " + marked.parse(full);
                        return;
                    }
                    try {
                        const j = JSON.parse(data);
                        if (j.token) {
                            full += j.token;
                            ai.textContent = "🤖 " + full;
                            box.scrollTop = box.scrollHeight;
                        }
                    } catch { }
                });
            }
        }

        /* =====================================================
           SESSION ACTIONS
        ===================================================== */
        async function createFinalDoc() {
            await fetch(`${BASE_URL}/export/session`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sessionId: sessionIdEl.value })
            });
            alert("Final document generated");
        }

        function downloadDoc() {
            window.open(`${BASE_URL}/docs/html/${sessionIdEl.value}.md`, "_blank");
        }
        function downloadDocPdf() {
            window.open(`${BASE_URL}/docs/pdf/${sessionIdEl.value}.md`, "_blank");
        }        

        async function destroySession() {
            if (!confirm("Destroy session permanently?")) return;
            const r = await fetch(`${BASE_URL}/session/${sessionIdEl.value}`, { method: "DELETE" });
            alert((await r.json()).success ? "Destroyed" : "Failed");
        }

        /* =====================================================
           INIT
        ===================================================== */
        const sessionIdEl = document.getElementById("sessionId");
        loadAgents();
    </script>

</body>

</html>
